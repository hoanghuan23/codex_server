<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mẫu 01 — Amber Cartography</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="map" aria-label="Bản đồ tương tác"></main>
    <div id="popupHost" class="popup-host hidden" role="dialog" aria-label="Thông tin khu vực"></div>
    <div class="top-center">
      <div class="search">
        <span class="search-pin">⌖</span
        ><input
          id="search"
          placeholder="Tìm tỉnh/thành phố trong dữ liệu..."
          autocomplete="off"
          aria-label="Tìm kiếm"
        /><button id="searchBtn" title="Tìm kiếm">⌕</button>
      </div>
      <div id="results" class="results hidden"></div>
    </div>
    <div class="map-tools">
      <button id="zoomIn" title="Phóng to">+</button
      ><button id="zoomOut" title="Thu nhỏ">−</button
      ><button id="fullscreen" title="Toàn màn hình">⛶</button>
    </div>
    <div class="layer-controls">
      <button id="layerToggle" class="layer-header" aria-expanded="true" aria-controls="layerList">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 3 21 8l-9 5-9-5 9-5Z" />
          <path d="m3 12 9 5 9-5M3 16l9 5 9-5" />
        </svg>
        <span>Chỉ số bản đồ</span>
        <span id="layerCount" class="count">0</span>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m6 14 6-6 6 6" />
        </svg>
      </button>
      <div id="layerList" class="layer-list"></div>
    </div>
    <section id="legend" class="legend">
      <div class="legend-head">
        <strong id="legendTitle">Độ ẩm (%)</strong><small>Theo dữ liệu</small>
      </div>
      <div id="gradient" class="gradient"></div>
      <div id="ticks" class="ticks"></div>
      <div class="legend-foot"><span id="legendFoot">Chưa có dữ liệu</span></div>
      <button id="previewPopupBtn" class="preview-popup-btn" type="button">Xem giao diện popup</button>
    </section>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
